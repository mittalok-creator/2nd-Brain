name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Structure
        run: python scripts/validate_repository.py --only structure

      - name: YAML specifications
        run: python scripts/validate_repository.py --only yaml

      - name: Internal documentation links
        run: python scripts/validate_repository.py --only links

      - name: Workspace page hierarchy
        run: python scripts/validate_repository.py --only hierarchy

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::A .env file is tracked. Remove it and rotate any exposed credential."
            exit 1
          fi
          echo "No tracked .env files."

      - name: No obvious secret material
        run: |
          if git ls-files | grep -E '\.(pem|key|p12)$|credentials.*\.json$|service-account.*\.json$'; then
            echo "::error::Credential-shaped file is tracked. See SECURITY.md."
            exit 1
          fi
          echo "No credential-shaped files."

      - name: Files end with a newline
        run: |
          status=0
          for file in $(git ls-files '*.md' '*.yaml' '*.yml' '*.py'); do
            if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then
              echo "::error file=$file::Missing trailing newline"
              status=1
            fi
          done
          exit $status

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        run: |
          pattern='^(feat|fix|docs|refactor|chore|test|ci|style|perf|revert)(\([a-z0-9/-]+\))?!?: .+'
          status=0
          while read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in
              Merge*|Revert*) continue ;;
            esac
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::Not a conventional commit: $subject"
              status=1
            fi
          done < <(git log --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $status
        shell: bash
