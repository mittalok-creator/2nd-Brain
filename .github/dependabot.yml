version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "type: chore"
      - "layer: ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/scripts"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(scripts)"
    labels:
      - "type: chore"
      - "layer: scripts"
